# The same gates lefthook runs before a commit and before a push. Keep the two in step.
#
# The `secrets` job is the one exception: gitleaks is not a rokit pin, so it runs here only. A
# secret found after the push is late already, but the run is what makes the rule visible.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact .

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: CompeyDev/setup-rokit@v0.2.1

      - name: Format
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Strict mode
        run: sh scripts/check-strict.sh

      - name: File size
        run: sh scripts/check-file-size.sh

      - name: English only
        run: sh scripts/check-english.sh

      - name: Types
        run: sh scripts/type-check.sh

      - name: Package
        run: sh scripts/check-package.sh

      - name: Tests
        run: sh scripts/run-tests.sh

      - name: Mutants
        run: luneblox run tests/Mutate --yes

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # The Worker's tests run on Node's own SQLite (node:sqlite), which D1 is.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.9.0

      # Before the install: a lock that names a private mirror fails `npm ci` with a network error
      # that says nothing of the cause.
      - name: Lockfile
        run: sh scripts/check-lockfile.sh

      - name: Install
        run: npm ci

      - name: Worker
        run: sh scripts/check-worker.sh
