# Tools managed by Rokit (https://github.com/rojo-rbx/rokit). Run `rokit install` after cloning.
#
# Every version is pinned exactly, to the latest stable release at the time it was added (2026-10-05).
# When a pin is bumped, it goes to the latest stable release again, never to a prerelease.
#
# Specs run on LuneBlox, a Lune fork that runs the Luau version and fast flags Roblox runs, so the
# ring, the batching and the pseudonym checked here are computed by the VM a game computes them with.
#
# The Worker's tools are Node's, pinned in package.json and package-lock.json.

[tools]
luneblox = "XopoIII/LuneBlox@0.10.13"       # Luau runtime for the specs
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1"  # `luau-lsp analyze` is the type gate
selene = "Kampfkarren/selene@0.32.0"        # linter
stylua = "JohnnyMorganz/StyLua@2.5.2"       # formatter
lefthook = "evilmartians/lefthook@2.1.17"   # git hooks
pesde = "pesde-pkg/pesde@0.7.4+registry.0.2.3"  # packs and publishes the pesde package
